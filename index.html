<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wetter Dashboard - Modern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#0ea5e9;--radius:1rem}
    [data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem}
    .container{max-width:1200px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
    h1{font-size:1.5rem;background:linear-gradient(135deg,var(--accent),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .btn{padding:.6rem 1rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff;border:none}
    .search{display:flex;gap:.5rem;margin-bottom:1.5rem;max-width:600px}
    .search input{flex:1;padding:.75rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem}
    .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .stat{text-align:center;padding:1rem;background:var(--bg);border-radius:.5rem}
    .stat-value{font-size:1.25rem;font-weight:600}
    .stat-label{font-size:.75rem;color:var(--muted)}
    .hourly{display:flex;gap:1rem;overflow-x:auto;padding:.5rem}
    .hour-item{min-width:80px;text-align:center;padding:1rem;background:var(--bg);border-radius:.5rem}
    .daily{display:flex;flex-direction:column;gap:.5rem}
    .day-item{display:flex;justify-content:space-between;padding:.75rem;background:var(--bg);border-radius:.5rem}
    .toggle{display:inline-flex;background:var(--bg);border-radius:.5rem;padding:.25rem}
    .toggle button{padding:.5rem 1rem;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:.25rem}
    .toggle button.active{background:var(--accent);color:#fff}
    canvas{max-height:400px}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌤️ Wetter Dashboard</h1>
    <div><button id="themeBtn" class="btn">🌓</button></div>
  </header>
  <div class="search">
    <button id="locateBtn" class="btn">📍</button>
    <input id="locationInput" placeholder="Stadt eingeben..." value="Berlin"/>
    <button id="loadBtn" class="btn btn-primary">Suchen</button>
  </div>
  <div id="status" style="padding:1rem;margin-bottom:1rem;border-radius:var(--radius);display:none"></div>
  
  <section class="card" id="currentCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
      <div style="display:flex;align-items:center;gap:1rem">
        <span id="curIcon" style="font-size:3rem">🌤️</span>
        <div>
          <div id="curTemp" style="font-size:2.5rem;font-weight:700">--°</div>
          <div id="curDesc" style="color:var(--muted)">--</div>
        </div>
      </div>
      <div id="locationName" style="color:var(--muted)">--</div>
    </div>
    <div class="grid" id="detailsGrid" style="margin-top:1rem"></div>
  </section>

  <section class="card" id="hourlyCard" style="display:none">
    <h3>Stundenvorhersage</h3>
    <div class="hourly" id="hourlyList" style="margin-top:1rem"></div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h3>Wetterverlauf</h3>
      <div class="toggle"><button id="dayBtn" class="active">Tag</button><button id="weekBtn">Woche</button></div>
    </div>
    <canvas id="chart"></canvas>
  </section>

  <section class="card" id="weeklyCard" style="display:none">
    <h3>7-Tage Vorhersage</h3>
    <div class="daily" id="dailyList" style="margin-top:1rem"></div>
  </section>

  <footer class="card" style="margin-top:2rem;font-size:.875rem;color:var(--muted)">
    Daten: Open-Meteo API | Keine Speicherung von Standortdaten
  </footer>
</div>

<script>
const $=id=>document.getElementById(id);
let chart,lastData,zoom='day',isC=true,statusTimer;
const icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
const desc={0:'Klar',1:'Überwiegend klar',2:'Teilweise bewölkt',3:'Bewölkt',45:'Nebel',51:'Nieselregen',61:'Regen',71:'Schnee',80:'Schauer',95:'Gewitter'};
const getT=c=>isC?c:Math.round(c*9/5+32);
const setStatus=(m,t='info')=>{const s=$('status');s.textContent=m;s.style.background=t==='error'?'rgba(239,68,68,0.1)':'rgba(14,165,233,0.1)';s.style.color=t==='error'?'#ef4444':'#0ea5e9';s.style.display='block';if(t==='success')setTimeout(()=>s.style.display='none',3000)};

$('themeBtn').onclick=()=>{const d=document.documentElement.getAttribute('data-theme")==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',d);localStorage.setItem('theme',d)};
$('dayBtn').onclick=()=>{zoom='day';$('dayBtn').classList.add('active');$('weekBtn').classList.remove('active');if(lastData)renderChart(lastData)};
$('weekBtn').onclick=()=>{zoom='week';$('weekBtn').classList.add('active');$('dayBtn').classList.remove('active');if(lastData)renderChart(lastData)};
$('loadBtn').onclick=loadWeather;
$('locationInput').onkeydown=e=>{if(e.key==='Enter')loadWeather()};
$('locateBtn').onclick=()=>{if(navigator.geolocation){setStatus('Standort wird ermittelt...','info');navigator.geolocation.getCurrentPosition(async p=>{try{const lat=p.coords.latitude,lon=p.coords.longitude;const r=await fetch(`https://geocode.maps.co/reverse?lat=${lat}&lon=${lon}`);const j=await r.json();$('locationInput').value=j.address?.city||j.address?.town||`${lat.toFixed(2)},${lon.toFixed(2)}`;loadWeather()}catch(e){setStatus('Fehler beim Laden','error')}})}};

async function loadWeather(){
  const loc=$('locationInput').value.trim();
  if(!loc){setStatus('Bitte Ort eingeben','error');return;}
  setStatus('Lade Daten...','info');
  try{
    const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(loc)}&count=1&language=de`);
    const gj=await g.json();
    if(!gj.results?.length)throw new Error('Ort nicht gefunden');
    const{latitude:lat,longitude:lon,name}=gj.results[0];
    const w=await fetch(`https://api.open-meteo.com/v1/forecast?lat=${lat}&lon=${lon}&hourly=temperature_2m,precipitation,weathercode,relativehumidity_2m,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto`);
    const wj=await w.json();
    lastData={place:name,daily:wj.daily,hourly:wj.hourly};
    renderCurrent(wj);
    renderHourly(wj);
    renderDaily(wj);
    renderChart({hourly:wj.hourly});
    setStatus('Daten geladen','success');
  }catch(e){setStatus(e.message,'error')}
}

function renderCurrent(d){
  $('currentCard').style.display='block';
  const now=new Date().getHours();
  const code=d.hourly.weathercode[now]||0;
  $('curIcon').textContent=icons[code]||'🌤️';
  $('curTemp').textContent=getT(d.hourly.temperature_2m[now])+'°';
  $('curDesc').textContent=desc[code]||'Unbekannt';
  $('locationName').textContent=lastData.place;
  $('detailsGrid').innerHTML=`
    <div class="stat"><div class="stat-value">${d.hourly.relativehumidity_2m[now]}%</div><div class="stat-label">Luftfeuchte</div></div>
    <div class="stat"><div class="stat-value">${d.hourly.windspeed_10m[now]}km/h</div><div class="stat-label">Wind</div></div>
    <div class="stat"><div class="stat-value">${d.hourly.precipitation[now]}mm</div><div class="stat-label">Niederschlag</div></div>
  `;
}

function renderHourly(d){
  $('hourlyCard').style.display='block';
  const now=new Date().getHours();
  $('hourlyList').innerHTML=d.hourly.time.slice(0,24).map((t,i)=>{
    const h=new Date(t).getHours();
    const code=d.hourly.weathercode[i]||0;
    return `<div class="hour-item"><div>${h===now?'Jetzt':h+':00'}</div><div style="font-size:1.5rem">${icons[code]||'🌤️'}</div><div>${getT(d.hourly.temperature_2m[i])}°</div></div>`;
  }).join('');
}

function renderDaily(d){
  $('weeklyCard').style.display='block';
  $('dailyList').innerHTML=d.daily.time.map((t,i)=>{
    const code=d.daily.weathercode[i]||0;
    const day=new Date(t).toLocaleDateString('de-DE',{weekday:'short'});
    return `<div class="day-item"><span>${i===0?'Heute':day}</span><span>${icons[code]||'🌤️'}</span><span>${getT(d.daily.temperature_2m_max[i])}°/${getT(d.daily.temperature_2m_min[i])}°</span></div>`;
  }).slice(0,7).join('');
}

function renderChart(d){
  if(chart)chart.destroy();
  const labels=zoom==='day'?d.hourly.time.slice(0,24).map(t=>new Date(t).getHours()+':00'):d.daily.time.slice(0,7).map(t=>new Date(t).toLocaleDateString('de-DE',{weekday:'short'}));
  const temps=zoom==='day'?d.hourly.temperature_2m.slice(0,24).map(getT):d.daily.temperature_2m_max.slice(0,7).map(getT);
  const rain=zoom==='day'?d.hourly.precipitation.slice(0,24):d.daily.precipitation_sum.slice(0,7);
  chart=new Chart($('chart'),{type:'line',data:{labels,datasets:[{label:'Temp (°)',data:temps,borderColor:'#0ea5e9',backgroundColor:'rgba(14,165,233,0.1)',fill:true,yAxisID:'y'},{type:'bar',label:'Regen (mm)',data:rain,backgroundColor:'rgba(14,165,233,0.3)',yAxisID:'y1'}]},options:{responsive:true,interaction:{mode:'nearest',axis:'x'},scales:{y:{position:'left',title:{display:true,text:'°C'}},y1:{position:'right',beginAtZero:true,title:{display:true,text:'mm'}}}}});
}

// Init
const savedTheme=localStorage.getItem('theme');
if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
loadWeather();
</script>
</body>
</html>
